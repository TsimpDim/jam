<div class="main-container">
  <div class="login-wrapper">
    <form clrForm class="login" [formGroup]="form">
      <section class="title">
        <h3 class="welcome">Reset your password</h3>
        <p class="subtitle">
          Enter your email address and we'll send you a link to reset your
          password.
        </p>
      </section>
      <div class="login-group">
        <clr-alert
          [clrAlertClosable]="false"
          [clrAlertType]="'danger'"
          *ngIf="errorMessage"
        >
          <clr-alert-item>
            <span class="alert-text">
              {{ errorMessage }}
            </span>
          </clr-alert-item>
        </clr-alert>

        <clr-alert
          [clrAlertClosable]="false"
          [clrAlertType]="'success'"
          *ngIf="successMessage"
        >
          <clr-alert-item>
            <span class="alert-text">
              {{ successMessage }}
            </span>
          </clr-alert-item>
        </clr-alert>

        <clr-input-container *ngIf="!successMessage">
          <label>Email</label>
          <input
            clrInput
            name="email"
            type="email"
            placeholder="john@example.com"
            formControlName="email"
          />
          <clr-control-error *clrIfError="'required'"
            >Email is required</clr-control-error
          >
          <clr-control-error *clrIfError="'email'"
            >Please enter a valid email address</clr-control-error
          >
        </clr-input-container>

        <div
          class="column"
          style="margin-left: auto; flex: 1"
          *ngIf="!successMessage"
        >
          <div class="row">
            <button
              class="btn btn-primary action"
              type="submit"
              (click)="submit()"
              [disabled]="loading"
            >
              SEND RESET LINK
            </button>
          </div>
          <div class="row">
            or
            <a
              class="nav-link"
              routerLink="/auth/login"
              style="margin-left: 0.3em"
              >back to login</a
            >
          </div>
        </div>

        <div
          class="column"
          style="margin-left: auto; flex: 1; font-size: 5em"
          *ngIf="successMessage"
        >
          <div class="row">
            <a class="btn btn-primary action" routerLink="/auth/login">
              BACK TO LOGIN
            </a>
          </div>
        </div>
      </div>
    </form>
    <img src="../../../assets/undraw_login.svg" />
  </div>
</div>
