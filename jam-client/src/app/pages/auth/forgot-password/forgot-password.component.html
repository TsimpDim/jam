<div class="main-container">
  <div class="login-wrapper">
    <form clrForm class="login" [formGroup]="form">
      <section class="title">
        <h3 class="welcome">Reset your password</h3>
        <p class="subtitle">
          Enter your email address and we'll send you a link to reset your
          password.
        </p>
      </section>
      <div class="login-group">
        <clr-input-container>
          <label>Email</label>
          <input
            clrInput
            name="email"
            type="email"
            placeholder="john@example.com"
            formControlName="email"
          />
          <clr-control-error *clrIfError="'required'"
            >Email is required</clr-control-error
          >
          <clr-control-error *clrIfError="'email'"
            >Please enter a valid email address</clr-control-error
          >
        </clr-input-container>

        <div class="column" style="margin-left: auto; flex: 1">
          <div class="row">
            <button
              class="btn btn-primary action"
              type="submit"
              (click)="submit()"
              [disabled]="loading"
            >
              SEND RESET LINK
            </button>
          </div>
          <div class="row">
            or
            <a
              class="nav-link"
              routerLink="/auth/login"
              style="margin-left: 0.3em"
              >back to login</a
            >
          </div>
        </div>
      </div>
    </form>
    <img src="../../../assets/undraw_login.svg" />
  </div>
</div>
