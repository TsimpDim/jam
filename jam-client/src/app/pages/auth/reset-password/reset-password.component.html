<div class="main-container">
  <div class="login-wrapper">
    <form clrForm class="login" [formGroup]="form">
      <section class="title">
        <h3 class="welcome">Set a new password</h3>
        <p class="subtitle">Enter your new password below.</p>
      </section>
      <div class="login-group">
        <clr-alert
          [clrAlertClosable]="false"
          [clrAlertType]="'danger'"
          *ngIf="errorMessage"
        >
          <clr-alert-item>
            <span class="alert-text">
              {{ errorMessage }}
            </span>
          </clr-alert-item>
        </clr-alert>

        <clr-alert
          [clrAlertClosable]="false"
          [clrAlertType]="'success'"
          *ngIf="successMessage"
        >
          <clr-alert-item>
            <span class="alert-text">
              {{ successMessage }}
            </span>
          </clr-alert-item>
        </clr-alert>

        <clr-password-container *ngIf="!successMessage">
          <label>New Password</label>
          <input
            clrPassword
            placeholder="New Password"
            name="new_password1"
            formControlName="new_password1"
          />
          <clr-control-error *clrIfError="'minlength'"
            >Password must be at least 8 characters</clr-control-error
          >
          <clr-control-error *clrIfError="'required'"
            >Make sure your password is filled in properly</clr-control-error
          >
        </clr-password-container>

        <clr-password-container *ngIf="!successMessage">
          <label>Confirm New Password</label>
          <input
            clrPassword
            placeholder="Confirm New Password"
            name="new_password2"
            formControlName="new_password2"
          />
          <clr-control-error *clrIfError="'notSame'"
            >Passwords do not match</clr-control-error
          >
          <clr-control-error *clrIfError="'required'"
            >Make sure your password is filled in properly</clr-control-error
          >
        </clr-password-container>

        <div
          class="column"
          style="margin-left: auto; flex: 1"
          *ngIf="!successMessage"
        >
          <div class="row">
            <button
              class="btn btn-primary action"
              type="submit"
              (click)="submit()"
              [disabled]="loading"
            >
              RESET PASSWORD
            </button>
          </div>
          <div class="row">
            or
            <a
              class="nav-link"
              routerLink="/auth/login"
              style="margin-left: 0.3em"
              >back to login</a
            >
          </div>
        </div>

        <div
          class="column"
          style="margin-left: auto; flex: 1"
          *ngIf="successMessage"
        >
          <div class="row">
            <a class="btn btn-primary action" routerLink="/auth/login">
              GO TO LOGIN
            </a>
          </div>
        </div>
      </div>
    </form>
    <img src="../../../assets/undraw_login.svg" />
  </div>
</div>
