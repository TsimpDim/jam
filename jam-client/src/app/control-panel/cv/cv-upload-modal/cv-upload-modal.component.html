<clr-modal
  [(clrModalOpen)]="open"
  [clrModalClosable]="!uploading"
  (clrModalOpenChange)="onModalOpenChange($event)"
>
  <h3 class="modal-title">{{ isEditMode ? "Update CV" : "Upload New CV" }}</h3>
  <div class="modal-body">
    <clr-alert
      [clrAlertClosable]="false"
      [clrAlertType]="'danger'"
      *ngIf="errorMessage"
    >
      <clr-alert-item>
        <span class="alert-text">{{ errorMessage }}</span>
      </clr-alert-item>
    </clr-alert>

    <form class="clr-form clr-form-horizontal" [formGroup]="form">
      <div class="clr-form-control">
        <clr-input-container>
          <label>CV Name *</label>
          <input
            clrInput
            type="text"
            formControlName="cvKey"
            placeholder="e.g., Tech CV v1"
          />
          <clr-control-helper
            >Give your CV a descriptive name</clr-control-helper
          >
          <clr-control-error *clrIfError="'required'"
            >CV name is required.</clr-control-error
          >
        </clr-input-container>
      </div>

      <div class="clr-form-control">
        <label class="clr-control-label">{{
          isEditMode ? "New CV File (optional)" : "CV File *"
        }}</label>
        <div class="clr-control-container">
          <input
            type="file"
            (change)="onFileSelected($event)"
            accept=".pdf,.doc,.docx"
          />
          <clr-control-helper>{{
            isEditMode
              ? "Leave empty to keep current file"
              : "PDF, DOC, DOCX (max 1MB)"
          }}</clr-control-helper>
        </div>
      </div>

      <div *ngIf="cvFile" class="file-preview">
        <cds-icon shape="check-circle" status="success"></cds-icon>
        <span>{{ cvFile.name }}</span>
      </div>
    </form>
  </div>
  <div class="modal-footer">
    <clr-spinner
      *ngIf="uploading"
      [clrMedium]="true"
      [clrInline]="true"
      [clrInverse]="true"
    ></clr-spinner>
    <button
      type="button"
      class="btn btn-outline"
      (click)="close()"
      [disabled]="uploading"
    >
      Cancel
    </button>
    <button
      type="button"
      class="btn btn-primary"
      (click)="submit()"
      [disabled]="uploading"
    >
      {{ isEditMode ? "Update CV" : "Upload CV" }}
    </button>
  </div>
</clr-modal>
