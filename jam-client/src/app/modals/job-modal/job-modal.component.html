<clr-modal
  [clrModalOpen]="isOpen"
  (clrModalOpenChange)="onClrModalOpenChange($event)"
  [clrModalClosable]="false"
  [clrModalSize]="'lg'"
>
  <h3 class="modal-title" *ngIf="application === null">Add Job Application</h3>
  <h3 class="modal-title" *ngIf="application !== null">Edit Job Application</h3>

  <div class="modal-body">
    <form class="clr-form form-grid job-form" [formGroup]="jobAppForm">
      <div class="form-section-header">
        <cds-icon shape="id-badge" size="14"></cds-icon>
        Position
      </div>

      <div class="clr-form-control">
        <clr-input-container>
          <label>Company *</label>
          <input
            clrInput
            type="text"
            name="company"
            formControlName="company"
            placeholder="Hooli"
          />
          <clr-control-error>Company is required</clr-control-error>
        </clr-input-container>
      </div>

      <div class="clr-form-control">
        <clr-input-container>
          <label>Role *</label>
          <input
            clrInput
            type="text"
            name="role"
            formControlName="role"
            placeholder="Software Engineer"
          />
          <clr-control-error>Role is required</clr-control-error>
        </clr-input-container>
      </div>

      <div class="clr-form-control">
        <clr-input-container>
          <label>Location</label>
          <input
            clrInput
            type="text"
            name="location"
            formControlName="location"
            placeholder="San Francisco"
          />
        </clr-input-container>
      </div>

      <div class="clr-form-control">
        <clr-select-container>
          <label>Lead</label>
          <select clrSelect name="lead" formControlName="lead">
            <option [ngValue]="null">No Lead</option>
            <option *ngFor="let lead of leads" [ngValue]="lead.id">
              {{ lead.company }} - {{ lead.role }}
            </option>
          </select>
        </clr-select-container>
      </div>

      <div class="form-section-header">
        <cds-icon shape="info-standard" size="14"></cds-icon>
        Application Details
      </div>

      <div class="clr-form-control">
        <clr-input-container>
          <label>Applied Through</label>
          <input
            clrInput
            type="text"
            name="appliedThrough"
            formControlName="appliedThrough"
            placeholder="LinkedIn"
          />
        </clr-input-container>
      </div>

      <div class="clr-form-control">
        <clr-date-container>
          <label>Date</label>
          <input clrDate type="date" name="date" formControlName="date" />
        </clr-date-container>
      </div>

      <div class="clr-form-control">
        <clr-select-container>
          <label>CV Used</label>
          <select clrSelect name="cvUsed" formControlName="cvUsed">
            <option [ngValue]="null">Not specified</option>
            <option *ngFor="let cv of cvs" [ngValue]="cv.id">
              {{ cv.key }}
            </option>
          </select>
        </clr-select-container>
      </div>

      <div class="clr-form-control">
        <clr-input-container>
          <label>External Link</label>
          <input
            clrInput
            type="text"
            name="externalLink"
            formControlName="externalLink"
            placeholder="https://..."
          />
        </clr-input-container>
      </div>

      <div class="form-section-header">
        <cds-icon shape="block" size="14"></cds-icon>
        Organisation
      </div>

      <div class="clr-form-control">
        <clr-select-container>
          <label>Group *</label>
          <select clrSelect name="group" formControlName="group">
            <option
              *ngFor="let group of groups; let i = index"
              [value]="group.id"
            >
              {{ group.name }}
            </option>
          </select>
          <clr-control-error>Group is required</clr-control-error>
        </clr-select-container>
      </div>

      <div class="clr-form-control" *ngIf="application === null">
        <clr-select-container>
          <label>Initial Step *</label>
          <select clrSelect name="initialStep" formControlName="initialStep">
            <option
              *ngFor="let step of initialSteps; let i = index"
              [value]="step.id"
            >
              {{ step.name }}
            </option>
          </select>
          <clr-control-error>Initial Step is required</clr-control-error>
        </clr-select-container>
      </div>

      <!-- Notes - full width -->
      <div class="clr-form-control form-field-full">
        <clr-textarea-container>
          <label>Notes</label>
          <textarea
            clrTextarea
            name="notes"
            formControlName="notes"
            placeholder="Great first impression."
          ></textarea>
        </clr-textarea-container>
      </div>

      <div class="form-section-header">
        <cds-icon shape="file" size="14"></cds-icon>
        Files ({{ fileCount }} / {{ fileLimit }})
      </div>

      <app-file-upload
        *ngIf="application !== null"
        [jobAppId]="application.id"
        [isPremium]="isPremium"
        [fileLimit]="fileLimit"
        (filesChange)="onFileCountChanged($event)"
      ></app-file-upload>
    </form>
  </div>

  <div class="modal-footer">
    <clr-spinner
      *ngIf="loading"
      [clrMedium]="true"
      [clrInline]="true"
      [clrInverse]="true"
    ></clr-spinner>
    <button
      type="button"
      class="btn btn-danger-outline"
      (click)="deleteJobApp(application.id)"
      *ngIf="application !== null"
    >
      Delete
    </button>
    <button type="button" class="btn btn-outline" (click)="closeModal()">
      Cancel
    </button>
    <button type="submit" class="btn btn-primary" (click)="submitJobAppForm()">
      Submit
    </button>
  </div>
</clr-modal>

<app-lead-prefill-modal
  [open]="leadPrefillPromptOpen"
  [lead]="pendingLeadForPrefill"
  (closed)="closeLeadPrefillPrompt()"
  (confirmed)="confirmLeadPrefill()"
></app-lead-prefill-modal>
