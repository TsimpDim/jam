<header class="header header-3">
  <div class="branding">
    <button
      class="mobile-menu-toggle"
      (click)="toggleMobileMenu()"
      aria-label="Toggle menu"
    >
      <cds-icon
        [shape]="mobileMenuOpen ? 'window-close' : 'bars'"
        size="sm"
      ></cds-icon>
    </button>
    <a class="nav-link" routerLink="/">
      <div class="title jam"></div>
    </a>
  </div>
  <div class="header-nav" [class.mobile-open]="mobileMenuOpen">
    <ng-container *ngIf="isLoggedIn">
      <a
        class="nav-link"
        routerLinkActive="active"
        routerLink="/applications"
        (click)="closeMobileMenu()"
        >Applications</a
      >
      <a
        class="nav-link"
        routerLinkActive="active"
        routerLink="/steps"
        (click)="closeMobileMenu()"
        >Steps</a
      >
      <a
        class="nav-link"
        routerLinkActive="active"
        routerLink="/leads"
        (click)="closeMobileMenu()"
        >Leads</a
      >
      <a
        class="nav-link"
        routerLinkActive="active"
        routerLink="/cv"
        (click)="closeMobileMenu()"
        >CVs</a
      >
      <a
        class="nav-link"
        routerLinkActive="active"
        routerLink="/analytics"
        (click)="closeMobileMenu()"
        >Analytics</a
      >
    </ng-container>
  </div>
  <div class="header-actions">
    <clr-dropdown>
      <button clrDropdownTrigger class="dropdown-toggle" type="button">
        <cds-icon size="md" shape="cog"></cds-icon>
      </button>
      <clr-dropdown-menu clrPosition="bottom-right">
        <h4 class="dropdown-header">Options</h4>
        <div *ngIf="isLoggedIn">
          <button class="dropdown-item" (click)="logout()">Logout</button>
        </div>
        <div *ngIf="!isLoggedIn">
          <a class="dropdown-item" routerLink="/auth/login">Login</a>
          <a class="dropdown-item" routerLink="/auth/register">Register</a>
        </div>
      </clr-dropdown-menu>
    </clr-dropdown>
  </div>
</header>
