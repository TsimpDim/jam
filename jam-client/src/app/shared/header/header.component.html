<header class="header header-3">
  <div class="branding">
    <button
      type="button"
      *ngIf="isLoggedIn"
      class="mobile-menu-toggle"
      (click)="toggleMobileMenu()"
      aria-label="Toggle menu"
    >
      <cds-icon
        [shape]="mobileMenuOpen ? 'window-close' : 'bars'"
        size="sm"
      ></cds-icon>
    </button>
    <a class="nav-link" routerLink="/">
      <div class="title jam"></div>
    </a>
  </div>
  <div class="header-nav" [class.mobile-open]="mobileMenuOpen">
    <ng-container *ngIf="isLoggedIn">
      <a
        id="nav-applications"
        class="nav-link"
        routerLinkActive="active"
        routerLink="/applications"
        (click)="closeMobileMenu()"
        >Applications</a
      >
      <a
        id="nav-steps"
        class="nav-link"
        routerLinkActive="active"
        routerLink="/steps"
        (click)="closeMobileMenu()"
        >Steps</a
      >
      <a
        id="nav-leads"
        class="nav-link"
        routerLinkActive="active"
        routerLink="/leads"
        (click)="closeMobileMenu()"
        >Leads</a
      >
      <a
        id="nav-cv"
        class="nav-link"
        routerLinkActive="active"
        routerLink="/cv"
        (click)="closeMobileMenu()"
        >CVs</a
      >
      <a
        id="nav-analytics"
        class="nav-link"
        routerLinkActive="active"
        routerLink="/analytics"
        (click)="closeMobileMenu()"
        >Analytics</a
      >
    </ng-container>
  </div>
  <div class="header-actions">
    <app-notification-bell *ngIf="isLoggedIn"></app-notification-bell>
    <button
      class="theme-toggle"
      type="button"
      [attr.aria-label]="
        themeService.isDark() ? 'Switch to light theme' : 'Switch to dark theme'
      "
      (click)="themeService.toggle()"
    >
      <cds-icon
        size="md"
        [shape]="themeService.isDark() ? 'sun' : 'moon'"
      ></cds-icon>
    </button>
    <button
      *ngIf="isLoggedIn"
      class="header-action-btn"
      type="button"
      aria-label="Logout"
      (click)="logout()"
    >
      <cds-icon size="md" shape="logout"></cds-icon>
    </button>
    <ng-container *ngIf="!isLoggedIn">
      <a class="nav-link" routerLink="/auth/login">Login</a>
      <a class="nav-link" routerLink="/auth/register">Register</a>
    </ng-container>
  </div>
</header>
