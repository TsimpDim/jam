<div class="add-app-header">
  <button class="btn btn-back" (click)="onCancel()">← Back</button>
</div>

<div class="add-app-form">
  <h2>Save Lead</h2>

  <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>
  <div class="success-message" *ngIf="successMessage">{{ successMessage }}</div>

  <form [formGroup]="form" (ngSubmit)="onSave()">
    <div class="form-group">
      <label for="company">Company *</label>
      <input type="text" formControlName="company" placeholder="Hooli" />
    </div>

    <div class="form-group">
      <label for="role">Role *</label>
      <input
        type="text"
        formControlName="role"
        placeholder="Software Engineer"
      />
    </div>

    <div class="form-group">
      <label for="location">Location</label>
      <input
        type="text"
        formControlName="location"
        placeholder="San Francisco"
      />
    </div>

    <div class="form-group">
      <label for="externalLink">External Link</label>
      <input
        type="text"
        formControlName="externalLink"
        placeholder="https://..."
      />
    </div>

    <div class="form-group">
      <label for="notes">Notes</label>
      <textarea
        formControlName="notes"
        placeholder="Interesting opportunity."
      ></textarea>
    </div>

    <div class="button-row">
      <button type="button" class="btn btn-secondary" (click)="onCancel()">
        Cancel
      </button>
      <button type="submit" class="btn btn-primary" [disabled]="loading">
        Save Lead
      </button>
    </div>
  </form>
</div>
