<div class="add-app-header">
  <button class="btn btn-back" (click)="onCancel()">← Back</button>
</div>

<div class="add-app-form">
  <h2>Add Application</h2>

  <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>
  <div class="success-message" *ngIf="successMessage">{{ successMessage }}</div>

  <form [formGroup]="form" (ngSubmit)="onSave()">
    <div class="form-group">
      <label for="company">Company *</label>
      <input type="text" formControlName="company" placeholder="Hooli" />
    </div>

    <div class="form-group">
      <label for="lead">Lead</label>
      <select formControlName="lead">
        <option value="">No Lead</option>
        <option *ngFor="let lead of leads" [value]="lead.id">
          {{ lead.company }} - {{ lead.role }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label for="role">Role *</label>
      <input
        type="text"
        formControlName="role"
        placeholder="Software Engineer"
      />
    </div>

    <div class="form-group">
      <label for="location">Location</label>
      <input
        type="text"
        formControlName="location"
        placeholder="San Francisco"
      />
    </div>

    <div class="form-group">
      <label for="appliedThrough">Applied Through</label>
      <input
        type="text"
        formControlName="appliedThrough"
        placeholder="LinkedIn"
      />
    </div>

    <div class="form-group">
      <label for="externalLink">External Link</label>
      <input
        type="text"
        formControlName="externalLink"
        placeholder="https://..."
      />
    </div>

    <div class="form-group">
      <label for="notes">Notes</label>
      <textarea
        formControlName="notes"
        placeholder="Great first impression."
      ></textarea>
    </div>

    <div class="form-group">
      <label for="date">Date</label>
      <input type="date" formControlName="date" />
    </div>

    <div class="form-group">
      <label for="group">Group *</label>
      <select formControlName="group">
        <option *ngFor="let group of groups" [value]="group.id">
          {{ group.name }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label for="initialStep">Initial Step *</label>
      <select formControlName="initialStep">
        <option *ngFor="let step of initialSteps" [value]="step.id">
          {{ step.name }}
        </option>
      </select>
    </div>

    <div class="button-row">
      <button type="button" class="btn btn-secondary" (click)="onCancel()">
        Cancel
      </button>
      <button type="submit" class="btn btn-primary" [disabled]="loading">
        Submit
      </button>
    </div>
  </form>
</div>
